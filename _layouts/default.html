<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title and page.title != site.title %}
  <title>{{ page.title | strip_html }} · {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/assets/o-piloto-interior.jpg' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/estilo.css' | relative_url }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ '/' | relative_url }}">O Piloto Interior</a>
    <nav><a href="{{ '/sumario.html' | relative_url }}">Sumário</a></nav>
  </header>
  <main class="{{ page.classe | default: 'pagina' }}">
    {{ content }}
  </main>
  <footer class="rodape">
    <p>Um livro em construção, de {{ site.author }}. Boa leitura, e boa estrada.</p>
  </footer>
</body>
</html>
